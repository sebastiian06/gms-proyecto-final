# Flyway configuration for GMS
# Load this configuration with: flyway -configFiles=flyway.conf ...
# Or set the FLYWAY_CONFIG_FILES environment variable.

flyway.url=${FLYWAY_URL}
flyway.user=${FLYWAY_USER}
flyway.password=${FLYWAY_PASSWORD}
flyway.locations=${FLYWAY_LOCATIONS}

# Enforce clean checksums — a migration that has already been applied cannot be edited
flyway.validateOnMigrate=true

# One sequence for the whole database, per 06-data/migrations.md
flyway.outOfOrder=false

# Baseline for existing databases (not used yet, but reserved)
flyway.baselineOnMigrate=false

# Logging
flyway.loggers=slf4j