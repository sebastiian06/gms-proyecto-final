spring.application.name=gms-api
spring.profiles.default=local

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/gms}
spring.datasource.username=${DATABASE_USER:gms_app}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080
server.servlet.context-path=/api/v1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET:change_me_in_local_with_at_least_32_characters}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

logging.level.com.gms=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Seed admin user
gms.seed.admin.username=${GMS_SEED_ADMIN_USERNAME:admin}
gms.seed.admin.password=${GMS_SEED_ADMIN_PASSWORD:admin123}